<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Geometry Dash Lite Launcher</title>

<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #111;
  }
  #playBtn {
    background: purple;
    color: white;
    border: 2px solid black;
    border-radius: 8px;
    padding: 12px 24px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.2s;
    position: relative;
    z-index: 9999;
  }
  #playBtn:hover {
    transform: scale(1.05);
  }
</style>
</head>

<body>

<button id="playBtn">Play in Fullscreen</button>

<script>
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("playBtn").addEventListener("click", () => {
    window.open("game.html", "_blank");
  });
});
</script>

</body>
</html>
